<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>방 만들기</title>
    <link rel="stylesheet" th:href="@{/css/finance.css}">
</head>
<body>
<div class="container">
    <header class="header">
        <a href="/rooms" class="btn-back">&larr; 돌아가기</a>
        <h1>방 만들기</h1>
    </header>

    <div class="content">
        <form id="createRoomForm" class="form-container">
            <div class="form-group">
                <label for="name">방 이름 <span class="required">*</span></label>
                <input type="text" id="name" name="name" placeholder="예) 우리 가족 가계부" required maxlength="100">
            </div>

            <div class="form-group">
                <label for="description">설명</label>
                <textarea id="description" name="description" rows="3" placeholder="방에 대한 설명을 입력하세요" maxlength="500"></textarea>
            </div>

            <div class="form-group">
                <label for="maxMembers">최대 인원</label>
                <input type="number" id="maxMembers" name="maxMembers" value="10" min="2" max="50">
                <span class="form-hint">2~50명 (기본: 10명)</span>
            </div>

            <div class="form-actions">
                <button type="button" class="btn-secondary" onclick="history.back()">취소</button>
                <button type="submit" class="btn-primary">만들기</button>
            </div>
        </form>
    </div>
</div>

<script th:inline="javascript">
    document.getElementById('createRoomForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const formData = {
            name: document.getElementById('name').value,
            description: document.getElementById('description').value || null,
            maxMembers: parseInt(document.getElementById('maxMembers').value) || 10
        };

        try {
            const response = await fetch('/api/v1/rooms', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData),
                credentials: 'include'
            });

            if (response.ok || response.status === 201) {
                const room = await response.json();
                alert('방이 생성되었습니다!');
                window.location.href = '/rooms/' + room.id;
            } else {
                const error = await response.json();
                alert('방 생성 실패: ' + (error.message || '알 수 없는 오류'));
            }
        } catch (error) {
            console.error('Error:', error);
            alert('방 생성 중 오류가 발생했습니다.');
        }
    });
</script>
</body>
</html>
