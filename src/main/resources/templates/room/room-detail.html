<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>방 상세</title>
    <link rel="stylesheet" th:href="@{/css/finance.css}">
</head>
<body>
<div class="container">
    <header class="header">
        <div class="header-left">
            <a href="/rooms" class="btn-back">&larr; 방 목록</a>
            <h1 th:text="${room.name}">방 이름</h1>
        </div>
        <div class="user-info">
            <span th:text="${username}">사용자</span>
        </div>
    </header>

    <div class="content">
        <!-- 방 정보 섹션 -->
        <section class="dashboard-partition">
            <!-- 읽기 모드 -->
            <div id="viewMode">
                <div class="partition-header">
                    <h2>방 정보</h2>
                    <button th:if="${isHost}" onclick="enterEditMode()" class="btn-add-small">수정</button>
                </div>

                <div class="room-info-grid">
                    <div class="info-row">
                        <label>방 이름</label>
                        <span th:text="${room.name}">방 이름</span>
                    </div>
                    <div class="info-row">
                        <label>설명</label>
                        <span th:text="${room.description} ?: '없음'">설명</span>
                    </div>
                    <div class="info-row">
                        <label>현재 인원 / 최대 인원</label>
                        <span th:text="${memberCount} + ' / ' + ${room.maxMembers} + '명'">0 / 10명</span>
                    </div>
                    <div class="info-row">
                        <label>상태</label>
                        <span class="room-status-badge"
                              th:classappend="${room.status.toString() == 'ACTIVE'} ? 'status-active' : 'status-dissolved'"
                              th:text="${room.status.description}">활성</span>
                    </div>
                </div>

                <div class="detail-actions" th:if="${isHost}" style="margin-top: 16px;">
                    <button onclick="dissolveRoom()" class="btn-danger">방 해산</button>
                </div>
                <div class="detail-actions" th:unless="${isHost}" style="margin-top: 16px;">
                    <button onclick="leaveRoom()" class="btn-danger">방 나가기</button>
                </div>
            </div>

            <!-- 수정 모드 (방장만) -->
            <div id="editMode" style="display: none;">
                <div class="partition-header">
                    <h2>방 정보 수정</h2>
                </div>
                <form id="editRoomForm" class="form-container" style="box-shadow: none; padding: 0;">
                    <div class="form-group">
                        <label for="editName">방 이름 <span class="required">*</span></label>
                        <input type="text" id="editName" th:value="${room.name}" required maxlength="100">
                    </div>
                    <div class="form-group">
                        <label for="editDescription">설명</label>
                        <textarea id="editDescription" rows="3" th:text="${room.description}" maxlength="500"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="editMaxMembers">최대 인원</label>
                        <input type="number" id="editMaxMembers" th:value="${room.maxMembers}" min="2" max="50">
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn-secondary" onclick="cancelEdit()">취소</button>
                        <button type="submit" class="btn-primary">저장</button>
                    </div>
                </form>
            </div>
        </section>

        <!-- 멤버 섹션 -->
        <section class="dashboard-partition" style="margin-top: 24px;">
            <div class="partition-header">
                <h2>멤버 (<span th:text="${memberCount}">0</span>명)</h2>
            </div>

            <div class="member-list">
                <div th:each="member : ${members}" class="member-card">
                    <div class="member-info">
                        <div class="member-avatar">&#128100;</div>
                        <div class="member-detail">
                            <span class="member-id">사용자 #<span th:text="${member.userId}">1</span></span>
                            <span class="member-role-badge"
                                  th:classappend="${member.role.toString() == 'HOST'} ? 'role-host' : 'role-member'"
                                  th:text="${member.role.description}">역할</span>
                        </div>
                    </div>
                    <div class="member-actions" th:if="${isHost && member.role.toString() != 'HOST'}">
                        <button th:onclick="'kickMember(' + ${member.userId} + ')'" class="btn-danger-small">추방</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- 초대 관리 섹션 (방장만) -->
        <section th:if="${isHost}" class="dashboard-partition" style="margin-top: 24px;">
            <div class="partition-header">
                <h2>초대 관리</h2>
                <button onclick="createInvite()" class="btn-add-small">+ 초대 코드 생성</button>
            </div>

            <div class="invite-list">
                <div th:if="${#lists.isEmpty(invites)}" class="empty-message">
                    <p>생성된 초대 코드가 없습니다.</p>
                </div>

                <div th:each="invite : ${invites}" class="invite-card">
                    <div class="invite-info">
                        <code class="invite-code" th:text="${invite.inviteCode}">초대코드</code>
                        <div class="invite-meta">
                            <span class="invite-status-badge"
                                  th:classappend="${invite.status.toString() == 'ACTIVE'} ? 'invite-active' : 'invite-expired'"
                                  th:text="${invite.status.description}">상태</span>
                            <span class="invite-expires" th:text="'만료: ' + ${#temporals.format(invite.expiresAt, 'yyyy-MM-dd HH:mm')}">만료일</span>
                        </div>
                    </div>
                    <div class="invite-actions">
                        <button th:onclick="'copyInviteCode(\'' + ${invite.inviteCode} + '\')'" class="btn-secondary-small">복사</button>
                        <button th:if="${invite.status.toString() == 'ACTIVE'}"
                                th:onclick="'revokeInvite(' + ${invite.id} + ')'" class="btn-danger-small">취소</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- 연결된 가계부 섹션 -->
        <section class="dashboard-partition" style="margin-top: 24px;">
            <div class="partition-header">
                <h2>연결된 가계부</h2>
                <button onclick="showLinkForm()" class="btn-add-small">+ 가계부 연결</button>
            </div>

            <!-- 가계부 연결 폼 -->
            <div id="linkForm" style="display: none; margin-bottom: 16px;">
                <form id="linkAccountBookForm" class="room-join-form">
                    <div class="join-input-group">
                        <input type="number" id="accountBookId" placeholder="가계부 ID를 입력하세요" required min="1">
                        <button type="submit" class="btn-primary">연결</button>
                        <button type="button" class="btn-secondary" onclick="hideLinkForm()">취소</button>
                    </div>
                </form>
            </div>

            <div class="accountbook-list">
                <div th:if="${#lists.isEmpty(accountBooks)}" class="empty-message">
                    <p>연결된 가계부가 없습니다.</p>
                </div>

                <div th:each="ab : ${accountBooks}" class="accountbook-card">
                    <div class="accountbook-info">
                        <span class="accountbook-icon">&#128214;</span>
                        <span class="accountbook-id">가계부 #<span th:text="${ab.accountBookId}">1</span></span>
                    </div>
                    <div class="accountbook-actions" th:if="${isHost}">
                        <button th:onclick="'unlinkAccountBook(' + ${ab.accountBookId} + ')'" class="btn-danger-small">연결 해제</button>
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>

<script th:inline="javascript">
    const roomId = /*[[${room.id}]]*/ 0;

    // --- 방 수정 ---
    function enterEditMode() {
        document.getElementById('viewMode').style.display = 'none';
        document.getElementById('editMode').style.display = 'block';
    }

    function cancelEdit() {
        document.getElementById('editMode').style.display = 'none';
        document.getElementById('viewMode').style.display = 'block';
    }

    document.getElementById('editRoomForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const formData = {
            name: document.getElementById('editName').value,
            description: document.getElementById('editDescription').value || null,
            maxMembers: parseInt(document.getElementById('editMaxMembers').value) || 10
        };

        try {
            const response = await fetch(`/api/v1/rooms/${roomId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData),
                credentials: 'include'
            });

            if (response.ok) {
                alert('방 정보가 수정되었습니다.');
                location.reload();
            } else {
                const error = await response.json();
                alert('수정 실패: ' + (error.message || '알 수 없는 오류'));
            }
        } catch (error) {
            console.error('Error:', error);
            alert('방 수정 중 오류가 발생했습니다.');
        }
    });

    // --- 방 해산 ---
    async function dissolveRoom() {
        if (!confirm('정말 이 방을 해산하시겠습니까?\n모든 멤버가 제거되고 연결된 가계부도 해제됩니다.\n이 작업은 되돌릴 수 없습니다.')) {
            return;
        }

        try {
            const response = await fetch(`/api/v1/rooms/${roomId}`, {
                method: 'DELETE',
                credentials: 'include'
            });

            if (response.ok || response.status === 204) {
                alert('방이 해산되었습니다.');
                window.location.href = '/rooms';
            } else {
                const error = await response.json();
                alert('해산 실패: ' + (error.message || '알 수 없는 오류'));
            }
        } catch (error) {
            console.error('Error:', error);
            alert('방 해산 중 오류가 발생했습니다.');
        }
    }

    // --- 방 나가기 ---
    async function leaveRoom() {
        if (!confirm('정말 이 방을 나가시겠습니까?')) {
            return;
        }

        try {
            const response = await fetch(`/api/v1/rooms/${roomId}/members/me`, {
                method: 'DELETE',
                credentials: 'include'
            });

            if (response.ok || response.status === 204) {
                alert('방을 나갔습니다.');
                window.location.href = '/rooms';
            } else {
                const error = await response.json();
                alert('나가기 실패: ' + (error.message || '알 수 없는 오류'));
            }
        } catch (error) {
            console.error('Error:', error);
            alert('방 나가기 중 오류가 발생했습니다.');
        }
    }

    // --- 멤버 추방 ---
    async function kickMember(targetUserId) {
        if (!confirm('이 멤버를 추방하시겠습니까?')) {
            return;
        }

        try {
            const response = await fetch(`/api/v1/rooms/${roomId}/members/${targetUserId}`, {
                method: 'DELETE',
                credentials: 'include'
            });

            if (response.ok || response.status === 204) {
                alert('멤버가 추방되었습니다.');
                location.reload();
            } else {
                const error = await response.json();
                alert('추방 실패: ' + (error.message || '알 수 없는 오류'));
            }
        } catch (error) {
            console.error('Error:', error);
            alert('멤버 추방 중 오류가 발생했습니다.');
        }
    }

    // --- 초대 코드 생성 ---
    async function createInvite() {
        try {
            const response = await fetch(`/api/v1/rooms/${roomId}/invites`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ expirationHours: 24 }),
                credentials: 'include'
            });

            if (response.ok || response.status === 201) {
                const invite = await response.json();
                alert('초대 코드가 생성되었습니다:\n' + invite.inviteCode);
                location.reload();
            } else {
                const error = await response.json();
                alert('생성 실패: ' + (error.message || '알 수 없는 오류'));
            }
        } catch (error) {
            console.error('Error:', error);
            alert('초대 코드 생성 중 오류가 발생했습니다.');
        }
    }

    // --- 초대 코드 복사 ---
    function copyInviteCode(code) {
        navigator.clipboard.writeText(code).then(() => {
            alert('초대 코드가 복사되었습니다!');
        }).catch(() => {
            // Fallback
            const textArea = document.createElement('textarea');
            textArea.value = code;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            alert('초대 코드가 복사되었습니다!');
        });
    }

    // --- 초대 취소 ---
    async function revokeInvite(inviteId) {
        if (!confirm('이 초대 코드를 취소하시겠습니까?')) {
            return;
        }

        try {
            const response = await fetch(`/api/v1/rooms/${roomId}/invites/${inviteId}`, {
                method: 'DELETE',
                credentials: 'include'
            });

            if (response.ok || response.status === 204) {
                alert('초대 코드가 취소되었습니다.');
                location.reload();
            } else {
                const error = await response.json();
                alert('취소 실패: ' + (error.message || '알 수 없는 오류'));
            }
        } catch (error) {
            console.error('Error:', error);
            alert('초대 취소 중 오류가 발생했습니다.');
        }
    }

    // --- 가계부 연결 ---
    function showLinkForm() {
        document.getElementById('linkForm').style.display = 'block';
    }

    function hideLinkForm() {
        document.getElementById('linkForm').style.display = 'none';
    }

    document.getElementById('linkAccountBookForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const accountBookId = parseInt(document.getElementById('accountBookId').value);

        try {
            const response = await fetch(`/api/v1/rooms/${roomId}/account-books`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ accountBookId: accountBookId }),
                credentials: 'include'
            });

            if (response.ok || response.status === 201) {
                alert('가계부가 연결되었습니다.');
                location.reload();
            } else {
                const error = await response.json();
                alert('연결 실패: ' + (error.message || '알 수 없는 오류'));
            }
        } catch (error) {
            console.error('Error:', error);
            alert('가계부 연결 중 오류가 발생했습니다.');
        }
    });

    // --- 가계부 연결 해제 ---
    async function unlinkAccountBook(accountBookId) {
        if (!confirm('이 가계부의 연결을 해제하시겠습니까?')) {
            return;
        }

        try {
            const response = await fetch(`/api/v1/rooms/${roomId}/account-books/${accountBookId}`, {
                method: 'DELETE',
                credentials: 'include'
            });

            if (response.ok || response.status === 204) {
                alert('가계부 연결이 해제되었습니다.');
                location.reload();
            } else {
                const error = await response.json();
                alert('해제 실패: ' + (error.message || '알 수 없는 오류'));
            }
        } catch (error) {
            console.error('Error:', error);
            alert('가계부 연결 해제 중 오류가 발생했습니다.');
        }
    }
</script>
</body>
</html>
